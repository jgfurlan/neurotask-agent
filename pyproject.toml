[project]
name = "ocean-vortex-agent"
version = "0.1.0"
description = "Autonomous multi-agent task orchestrator for Carnival OceanMedallion ecosystem powered by Snowflake Cortex AI and AWS Bedrock"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "langgraph>=0.0.30",
    "langchain-core>=0.1.30",
    "langchain-aws>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jgfurlan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-ocean_vortex}
    ports:
      - "5432:5432"

  agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://jgfurlan:password@db:5432/ocean_vortex}
      USE_MOCK_SNOWFLAKE: ${USE_MOCK_SNOWFLAKE:-true}
      USE_MOCK_BEDROCK: ${USE_MOCK_BEDROCK:-true}
      LANGCHAIN_TRACING_V2: "true"
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-mock_key}
    volumes:
      - ./src:/app/src
    command: uvicorn ocean_vortex.api.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - db

  test:
    profiles:
      - test
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://jgfurlan:password@db:5432/ocean_vortex}
      USE_MOCK_SNOWFLAKE: "true"
      USE_MOCK_BEDROCK: "true"
      LANGCHAIN_TRACING_V2: "true"
      LANGCHAIN_API_KEY: "mock_test_key"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    command: sh -c "ruff check . && mypy . && pytest"
    depends_on:
      - db
